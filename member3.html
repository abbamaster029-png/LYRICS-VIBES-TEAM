<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LYRICS VIBES TEAM | Sa'adatu Muhammad Adamu</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    padding:14px 10px 24px;
    background:
        radial-gradient(circle at 50% -20%,#1d477d 0%,#0d2b55 28%,#061a37 60%,#020a18 100%);
    color:#fff;
    font-family:'Inter',sans-serif;
}

.page{
    width:100%;
    max-width:380px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:13px;
}

.logo{
    width:30px;
    height:30px;
    margin:0 auto 6px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #d9ad32;
    border-radius:50%;
    background:#061a36;
    color:#e4b83f;
    font-family:'Playfair Display',serif;
    font-size:10px;
    font-weight:700;
}

.team-name{
    color:#e4b83f;
    font-family:'Playfair Display',serif;
    font-size:18px;
    font-weight:700;
    letter-spacing:.8px;
}

.subtitle{
    margin-top:4px;
    color:#9caabd;
    font-size:6.5px;
    font-weight:600;
    letter-spacing:1.9px;
}

.header-line{
    width:35px;
    height:1px;
    margin:7px auto 0;
    background:#d9ad32;
}

.card{
    overflow:hidden;
    background:linear-gradient(145deg,rgba(10,39,77,.98),rgba(3,16,35,.99));
    border:1px solid rgba(217,173,50,.55);
    border-radius:15px;
    box-shadow:0 15px 35px rgba(0,0,0,.3);
}

.profile{
    text-align:center;
    padding:17px 13px 14px;
}

.verified{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    margin-bottom:5px;
    color:#8494aa;
    font-size:6.5px;
    font-weight:600;
    letter-spacing:1px;
}

.verified-dot{
    width:4px;
    height:4px;
    border-radius:50%;
    background:#d9ad32;
}

.member-name{
    color:#fff;
    font-family:'Playfair Display',serif;
    font-size:18px;
    font-weight:600;
    margin-bottom:7px;
}

.position{
    display:inline-block;
    padding:4px 15px;
    border-radius:20px;
    background:linear-gradient(135deg,#e9c454,#c79620);
    color:#061832;
    font-size:7px;
    font-weight:700;
    letter-spacing:1px;
}

.member-meta{
    display:grid;
    grid-template-columns:1fr 1fr;
    border-top:1px solid rgba(217,173,50,.14);
    border-bottom:1px solid rgba(217,173,50,.14);
}

.meta{
    text-align:center;
    padding:9px 5px;
}

.meta:first-child{
    border-right:1px solid rgba(217,173,50,.14);
}

.meta-label{
    display:block;
    color:#718199;
    font-size:6px;
    font-weight:600;
    letter-spacing:.8px;
    margin-bottom:3px;
}

.meta-value{
    color:#dfb53e;
    font-size:8.5px;
    font-weight:600;
}

.private{
    padding:13px;
}

.private-heading{
    text-align:center;
    margin-bottom:9px;
}

.private-icon{
    width:28px;
    height:28px;
    margin:0 auto 5px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(217,173,50,.35);
    border-radius:50%;
    font-size:11px;
}

.private-title{
    color:#e1b63e;
    font-family:'Playfair Display',serif;
    font-size:12px;
}

.private-subtitle{
    color:#718096;
    font-size:6.5px;
    margin-top:2px;
}

.password-box{
    padding:10px;
    border:1px solid rgba(217,173,50,.16);
    border-radius:9px;
    background:rgba(0,7,18,.25);
    text-align:center;
}

.password-label{
    display:block;
    color:#7f8da2;
    font-size:6px;
    font-weight:600;
    letter-spacing:.8px;
    margin-bottom:4px;
}

input{
    width:100%;
    height:35px;
    border:1px solid rgba(217,173,50,.28);
    border-radius:7px;
    background:#061832;
    color:#fff;
    padding:0 10px;
    outline:none;
    text-align:center;
    font-size:9px;
}

button{
    width:100%;
    height:35px;
    margin-top:6px;
    border:0;
    border-radius:7px;
    background:linear-gradient(135deg,#edc653,#c79620);
    color:#061832;
    font-size:7px;
    font-weight:700;
    letter-spacing:.7px;
}

.error{
    display:none;
    margin-top:6px;
    color:#ff8585;
    font-size:7px;
}

.private-info{
    display:none;
    margin-top:10px;
    padding-top:9px;
    border-top:1px solid rgba(217,173,50,.16);
    text-align:center;
}

.info-item{
    padding:7px 2px;
    border-bottom:1px solid rgba(255,255,255,.05);
    line-height:1.45;
}

.info-item strong{
    display:block;
    color:#dcb33e;
    font-size:6.5px;
    margin-bottom:2px;
}

.info-item span{
    color:#d9e1ed;
    font-size:8px;
}

.qr-section{
    margin-top:13px;
    padding:13px 10px;
    text-align:center;
    border-top:1px solid rgba(217,173,50,.14);
}

.qr-title{
    color:#e1b63e;
    font-family:'Playfair Display',serif;
    font-size:11px;
}

.qr-subtitle{
    color:#718096;
    font-size:6.5px;
    margin:3px 0 9px;
}

#qrcode{
    width:116px;
    height:116px;
    margin:auto;
    padding:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    border-radius:8px;
    border:1px solid #d9ad
